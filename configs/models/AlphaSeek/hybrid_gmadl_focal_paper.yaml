target: pl_modules.alphaseek_module.HybridSSMTraderModule
params:
  variant: "hybrid"
  num_features: 12
  window_size: 30
  hidden_dim: 64
  tcn_channels: [64, 64]
  tcn_kernel_size: 3
  tcn_dropout: 0.1
  num_mamba_branches: 4
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
  mamba_use_fast_path: false
  attention_heads: 4
  attention_dropout: 0.1
  ffn_hidden_dim: 128
  action_classes: 3
  use_smoothing: true
  mode: "default"
  target_mode: "log_return"
  close_index: 4
  action_threshold: 0.002
  # Regression: GMADL penalises directional errors weighted by magnitude
  loss: "gmadl"
  gmadl_alpha: 1.0        # magnitude exponent; 1 = MADL-like
  gmadl_beta: 10.0        # sigmoid sharpness around direction boundary
  gmadl_tau: 0.0          # set > 0 to add transaction-cost soft-threshold
  regression_loss_weight: 1.0
  # Action: Focal loss down-weights easy 'hold' majority
  action_loss: "focal"
  focal_gamma: 2.0
  action_loss_weight: 0.3
  # Auxiliary: differentiable Sharpe
  sharpe_loss_weight: 0.1
  sharpe_temperature: 0.02
  # Turnover penalty: discourage rapid position switching
  turnover_penalty_weight: 0.05
normalize: false
