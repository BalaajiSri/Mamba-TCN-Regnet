program: scripts/wandb_sweep_agent.py
method: bayes
metric:
  name: val/rmse
  goal: minimize
parameters:
  lr:
    min: 0.0001
    max: 0.001
  weight_decay:
    values: [0.0, 0.0001, 0.0005]
  batch_size:
    values: [16, 32]
  max_epochs:
    values: [150, 250, 300]
  early_stopping_patience:
    values: [20, 30]
command:
  - python3
  - ${program}
  - --config
  - hybrid_ssm_trader_hybrid_1d
  - --wandb_project
  - MambaTCNRegNet

